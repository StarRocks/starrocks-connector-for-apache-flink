name: CI Pipeline

on:
  pull_request:
      types:
        - opened
        - synchronize

      branches:
        - main

concurrency:
  group: ${{ github.event.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Flink ${{ matrix.flink }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      max-parallel: 3
      matrix:
        # 1.x -> JDK 8, 2.0/2.1 -> JDK 11, 2.2+ -> JDK 17
        include:
          - flink: '1.20'
            java: '8'
          - flink: '1.19'
            java: '8'
          - flink: '1.18'
            java: '8'
          - flink: '1.17'
            java: '8'
          - flink: '1.16'
            java: '8'
          - flink: '2.0'
            java: '11'
          - flink: '2.1'
            java: '11'
          - flink: '2.2'
            java: '17'
          - flink: '2.3'
            java: '17'
    env:
      CUSTOM_MVN: mvn -B -ntp
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          fetch-depth: 0
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: ${{ matrix.java }}
          cache: 'maven'
      - name: Machine Info
        run: |
          echo "== OS Release ==" && cat /etc/os-release || true
          echo "== Kernel ==" && uname -a
          echo "== CPU ==" && lscpu || true
          echo "== Memory ==" && free -h || true
          echo "== Workspace ==" && pwd
          echo "== Disk Usage ==" && df -hT .
      - name: Docker Info
        shell: bash
        run: |
          docker info || true
      - name: Build starrocks-stream-load-sdk
        run: mvn -B -ntp -Dsurefire.forkCount=2 clean install
        working-directory: starrocks-stream-load-sdk
      - name: Build Flink ${{ matrix.flink }} Connector
        run: |
          chmod +x build.sh
          ./build.sh ${{ matrix.flink }} --run-tests